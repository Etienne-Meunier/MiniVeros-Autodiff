# wandb sweep for generate_matrix_data's variant matrix, consumed by
# ../sweep_matrix_data.py. Grid method = every variant runs exactly once,
# queue-distributed across however many `wandb agent` processes you launch
# (e.g. one per g5k node) instead of running sequentially.
#
# `values` must stay in sync with setups_matrix.VARIANTS_BY_NAME's names --
# no code path derives this file, so add/rename a variant there and mirror
# it here. test_sweep_config.py asserts the two agree, because a variant
# missing here is skipped silently: the sweep simply never queues it, and
# the rendered report shows a stale row for it instead of a gap.
#
# `global_1deg` is deliberately NOT in this list. It is ~56x global_4deg per
# step and carries its own horizon (setups_matrix's run_config), so it does
# not belong in a uniform grid sweep -- an agent that pulled it would either
# block a node or, if MATRIX_STEPS is set for the sweep, run it at the wrong
# horizon. Launch it on its own instead:
#   python test/generate_matrix_data.py --variant global_1deg --device gpu \
#       --run-id SWEEP_ID
#
# Launch (from repo root, locally -- `wandb sweep` only talks to the wandb
# server, the cluster plays no part in creating a sweep):
#   wandb sweep test/sweep/matrix.yaml   # prints SWEEP_ID
#   g5k agent SWEEP_ID --site grenoble --n-agents 8 \
#       --walltime 3:00:00 --no-besteffort
#   python test/plot_matrix_report.py --run-id SWEEP_ID
#
# The sweep id is also the run id every agent writes its results under, so
# there is nothing to pass around and nothing to keep in sync.
program: test/sweep_matrix_data.py
method: grid
parameters:
  # Single-valued, so grid still enumerates only `variant` -- this rides along
  # as a constant every agent reads from the sweep config, which puts the device
  # the matrix ran on in the sweep record instead of in a node's environment.
  device:
    value: cpu
  variant:
    values:
      - acc_basic
      - acc_full
      - acc_explicit_vert_friction
      - acc_no_hor_friction
      - acc_biharmonic_friction
      - acc_noslip_lateral
      - acc_ray_friction
      - acc_bottom_friction_var
      - acc_quadratic_bottom_friction
      - acc_surface_pressure
      - acc_hor_diffusion
      - acc_biharmonic_mixing
      - acc_no_neutral_diffusion
      - acc_no_skew_diffusion
      - acc_no_tke
      - acc_tke_superbee_advection
      - acc_eke_isopycnal_diffusion_off
      - acc_eke_superbee_off
      - acc_kappaH_profile_off
      - acc_minimal
      - acc_maximal
      - global_default
      - global_no_eke
      - global_biharmonic_friction
      - global_surface_pressure
      - global_hor_diffusion
      - global_biharmonic_mixing
      - global_no_neutral_diffusion
      - global_no_skew_diffusion
      - global_minimal
      - global_maximal
